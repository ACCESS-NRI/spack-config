packages:
  python:
    externals:
      # Provided by python3.12 and python3.12-devel on Rocky Linux
    - spec: python@3.12.13
      prefix: /usr
    buildable: true
  gcc:
    externals:
    - spec: gcc@8.5.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
